name: Fehlerbericht
description: Reproduzierbares Fehlverhalten melden
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduktion
      description: Welche Schritte führen zuverlässig zum Fehler?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser und Betriebssystem
