name: Generator module or feature
description: Propose a new, clearly scoped capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which specific CS2 configuration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the workflow, generated CFG lines, and expected validation.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: CS2 source
      description: Current Valve or GameTracking source for affected commands.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This feature does not automate multiple movement or attack actions with one input.
          required: true
