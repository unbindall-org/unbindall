name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version from package.json and CHANGELOG.md (without v)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      DATABASE_URL: postgresql://build:build@ep-build-pooler.eu-central-1.aws.neon.tech/neondb?sslmode=require
      AUTH_SECRET: ci-only-secret-that-is-never-used-at-runtime
      AUTH_URL: https://ci.example.com
      AUTH_EXPECTED_HOST: ci.example.com
      AUTH_TRUST_HOST: "true"
      TRUSTED_PROXY_COUNT: "1"
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Validate release metadata
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          grep -Fq "## [$VERSION] - " CHANGELOG.md
          ! git rev-parse "v$VERSION" >/dev/null 2>&1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Extract release notes
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "] - ") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[Unreleased\]:/) { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release-notes.md
