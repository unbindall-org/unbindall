name: unbindall-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unbindall_test
      POSTGRES_USER: unbindall
      POSTGRES_PASSWORD: unbindall
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unbindall -d unbindall_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_MIGRATION_URL: postgresql://unbindall:unbindall@db:5432/unbindall_test
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    environment:
      NODE_ENV: test
      UNBINDALL_CONTAINER_SMOKE_TEST: "true"
      DATABASE_URL: postgresql://unbindall:unbindall@db:5432/unbindall_test
      AUTH_SECRET: container-test-secret-at-least-32-characters
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: "true"
      TRUSTED_PROXY_COUNT: "1"
      DATABASE_POOL_MAX: "10"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "2"
      REDIS_URL: redis://redis:6379
    ports:
      - "3100:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
